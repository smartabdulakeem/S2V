name: Build Windows EXE

on:
  workflow_dispatch:        # Run manually from GitHub with one click
  push:
    tags:
      - 'v*'               # Also runs automatically when you push a version tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "ffmpeg_tmp" -Force
          $inner = Get-ChildItem "ffmpeg_tmp" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "vendor\ffmpeg\bin"
          Copy-Item "$($inner.FullName)\bin\ffmpeg.exe"  "vendor\ffmpeg\bin\"
          Copy-Item "$($inner.FullName)\bin\ffprobe.exe" "vendor\ffmpeg\bin\"
          Copy-Item "$($inner.FullName)\bin\ffplay.exe"  "vendor\ffmpeg\bin\"
        shell: powershell

      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --name S2V `
            --windowed `
            --onedir `
            --add-data "frontend;frontend" `
            --add-data "samples;samples" `
            --add-data "vendor;vendor" `
            --add-data "config/.gitkeep;config" `
            --hidden-import "pipeline.validator" `
            --hidden-import "pipeline.voiceover" `
            --hidden-import "pipeline.captions" `
            --hidden-import "pipeline.visuals" `
            --hidden-import "pipeline.composer" `
            --hidden-import "pipeline.stitcher" `
            --hidden-import "pipeline.orchestrator" `
            --hidden-import "pipeline.text_parser" `
            --hidden-import "webview" `
            --hidden-import "edge_tts" `
            --hidden-import "whisper" `
            --hidden-import "PIL" `
            --hidden-import "moviepy" `
            --collect-all "webview" `
            --collect-all "edge_tts" `
            --collect-all "whisper" `
            app.py
        shell: powershell

      - name: Zip the output
        run: |
          Compress-Archive -Path "dist\S2V" -DestinationPath "S2V-Windows.zip"
        shell: powershell

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: S2V-Windows
          path: S2V-Windows.zip
          retention-days: 30
