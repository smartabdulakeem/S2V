name: Build Windows EXE

on:
  workflow_dispatch:        # Run manually from GitHub with one click
  push:
    tags:
      - 'v*'               # Also runs automatically when you push a version tag

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --name S2V `
            --windowed `
            --onedir `
            --add-data "frontend;frontend" `
            --add-data "samples;samples" `
            --add-data "vendor/realesrgan;vendor/realesrgan" `
            --add-data "config/.gitkeep;config" `
            --hidden-import "pipeline.validator" `
            --hidden-import "pipeline.voiceover" `
            --hidden-import "pipeline.captions" `
            --hidden-import "pipeline.visuals" `
            --hidden-import "pipeline.composer" `
            --hidden-import "pipeline.stitcher" `
            --hidden-import "pipeline.orchestrator" `
            --hidden-import "pipeline.text_parser" `
            --hidden-import "webview" `
            --hidden-import "webview.platforms.edgechromium" `
            --hidden-import "whisper" `
            --hidden-import "PIL" `
            --collect-all "webview" `
            --collect-all "whisper" `
            app.py
        shell: powershell

      - name: Zip the output
        run: |
          Compress-Archive -Path "dist\S2V" -DestinationPath "S2V-Windows.zip"
        shell: powershell

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: S2V-Windows
          path: S2V-Windows.zip
          retention-days: 30
